  <!-- Title Slot -->
  <g id="review-title-slot" data-pptx-placeholder="title" data-pptx-bounds="280 44 800 40">
    <text id="review-title-carrier" data-pptx-carrier="true" x="280" y="74" fill="#C00000" font-size="28" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>

  <!-- Summary Banner Text Slot -->
  <g id="review-banner-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1" data-pptx-bounds="72 104 1136 44">
