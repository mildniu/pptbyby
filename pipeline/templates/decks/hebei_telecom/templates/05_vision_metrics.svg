<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="hebei_telecom_content_master" data-pptx-master-name="Hebei Telecom Content Master"
  data-pptx-layout="vision_target" data-pptx-layout-name="Vision and Targets"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <!-- Top Header Master -->
  <rect id="content-master-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="content-master-logo" x="72" y="38" width="180" height="48" href="../images/logo.png"
    preserveAspectRatio="xMinYMid meet" data-pptx-layer="master" data-pptx-editable="false"/>
  <text id="content-master-5g" x="1140" y="74" fill="#005BAC" font-size="30" font-weight="bold"
    data-pptx-layer="master" data-pptx-editable="false">5G<tspan fill="#C00000" font-size="24">+</tspan></text>
  <line id="content-master-rule" x1="72" y1="104" x2="1208" y2="104" stroke="#F1F5F9" stroke-width="1.5"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <!-- Title Slot -->
  <g id="vision-title-slot" data-pptx-placeholder="title" data-pptx-bounds="280 44 800 40">
    <text id="vision-title-carrier" data-pptx-carrier="true" x="280" y="74" fill="#C00000" font-size="28" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>

  <!-- Top Strategic Policy Block Slot -->
  <g id="vision-policy-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1" data-pptx-bounds="72 104 1136 88">
    <text id="vision-policy-carrier" data-pptx-carrier="true" x="96" y="134" fill="#1F2937" font-size="14">
      <tspan x="96" dy="0">{{POLICY_LINE_1}}</tspan>
      <tspan x="96" dy="24">{{POLICY_LINE_2}}</tspan>
    </text>
  </g>

  <!-- Quantitative Target Cards & Vision Pillars Slot -->
  <g id="vision-targets-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="72 218 1136 440">
    <text id="vision-targets-carrier" data-pptx-carrier="true" x="96" y="250" fill="#1F2937" font-size="14">
      {{VISION_TARGETS_AND_PILLARS}}
    </text>
  </g>

  <!-- Slide Number Slot -->
  <g id="vision-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="3" data-pptx-bounds="1128 660 80 28">
    <text id="vision-slide-number-carrier" data-pptx-carrier="true" x="1208" y="686" text-anchor="end" fill="#9CA3AF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">{{PAGE_NUM}}</text>
  </g>
</svg>
