<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="hebei_telecom_content_master" data-pptx-master-name="Hebei Telecom Content Master"
  data-pptx-layout="agenda" data-pptx-layout-name="Agenda"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <!-- Master Chrome -->
  <rect id="content-master-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="content-master-logo" x="72" y="38" width="180" height="48" href="../images/logo.png"
    preserveAspectRatio="xMinYMid meet" data-pptx-layer="master" data-pptx-editable="false"/>
  <text id="content-master-5g" x="1140" y="74" fill="#005BAC" font-size="30" font-weight="bold"
    data-pptx-layer="master" data-pptx-editable="false">5G<tspan fill="#C00000" font-size="24">+</tspan></text>
  <line id="content-master-rule" x1="72" y1="104" x2="1208" y2="104" stroke="#F1F5F9" stroke-width="1.5"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <!-- Left Layout Diamond Box -->
  <rect id="agenda-diamond-outer" x="150" y="270" width="180" height="180" rx="14" fill="#C00000"
    transform="rotate(45 240 360)" opacity="0.95" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="agenda-diamond-inner" x="164" y="284" width="152" height="152" rx="10" fill="#FFFFFF"
    transform="rotate(45 240 360)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-diamond-text" x="240" y="376" text-anchor="middle" fill="#C00000" font-size="44" font-weight="bold"
    data-pptx-layer="layout" data-pptx-editable="false">议程</text>

  <!-- Right Layout Cards & Badges -->
  <rect id="agenda-card-1" x="500" y="180" width="560" height="84" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="agenda-num-1-bg" cx="500" cy="222" r="38" fill="#C00000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-num-1-text" x="500" y="236" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="38" font-weight="bold"
    data-pptx-layer="layout" data-pptx-editable="false">1</text>

  <rect id="agenda-card-2" x="500" y="318" width="560" height="84" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="agenda-num-2-bg" cx="500" cy="360" r="38" fill="#C00000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-num-2-text" x="500" y="374" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="38" font-weight="bold"
    data-pptx-layer="layout" data-pptx-editable="false">2</text>

  <rect id="agenda-card-3" x="500" y="456" width="560" height="84" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="agenda-num-3-bg" cx="500" cy="498" r="38" fill="#C00000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-num-3-text" x="500" y="512" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="38" font-weight="bold"
    data-pptx-layer="layout" data-pptx-editable="false">3</text>

  <!-- Title Slot -->
  <g id="agenda-title-slot" data-pptx-placeholder="title" data-pptx-bounds="280 44 800 40">
    <text id="agenda-title-carrier" data-pptx-carrier="true" x="280" y="74" fill="#C00000" font-size="28" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>

  <!-- 3 Agenda Item Slots -->
  <g id="agenda-item-1-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="566 200 470 50">
    <text id="agenda-item-1-carrier" data-pptx-carrier="true" x="566" y="232" fill="#111827" font-size="26" font-weight="bold">{{AGENDA_1}}</text>
  </g>

  <g id="agenda-item-2-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="566 338 470 50">
    <text id="agenda-item-2-carrier" data-pptx-carrier="true" x="566" y="370" fill="#111827" font-size="26" font-weight="bold">{{AGENDA_2}}</text>
  </g>

  <g id="agenda-item-3-slot" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="566 476 470 50">
    <text id="agenda-item-3-carrier" data-pptx-carrier="true" x="566" y="508" fill="#111827" font-size="26" font-weight="bold">{{AGENDA_3}}</text>
  </g>

  <!-- Footer Slot -->
  <g id="agenda-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4" data-pptx-bounds="1128 660 80 28">
    <text id="agenda-slide-number-carrier" data-pptx-carrier="true" x="1208" y="680" text-anchor="end" fill="#9CA3AF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">{{PAGE_NUM}}</text>
  </g>
</svg>
