  <text id="content-master-5g" x="1140" y="74" fill="#005BAC" font-size="30" font-weight="bold"
    data-pptx-layer="master" data-pptx-editable="false">5G<tspan fill="#C00000" font-size="24">+</tspan></text>
  <line id="content-master-rule" x1="72" y1="104" x2="1208" y2="104" stroke="#F1F5F9" stroke-width="1.5"
