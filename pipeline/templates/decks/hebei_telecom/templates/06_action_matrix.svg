<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="hebei_telecom_content_master" data-pptx-master-name="Hebei Telecom Content Master"
  data-pptx-layout="action_grid" data-pptx-layout-name="Action Grid Matrix"
  font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <!-- Top Header Master -->
  <rect id="content-master-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="content-master-logo" x="72" y="38" width="180" height="48" href="../images/logo.png"
    preserveAspectRatio="xMinYMid meet" data-pptx-layer="master" data-pptx-editable="false"/>
  <text id="content-master-5g" x="1140" y="74" fill="#005BAC" font-size="30" font-weight="bold"
    data-pptx-layer="master" data-pptx-editable="false">5G<tspan fill="#C00000" font-size="24">+</tspan></text>
  <line id="content-master-rule" x1="72" y1="104" x2="1208" y2="104" stroke="#F1F5F9" stroke-width="1.5"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <!-- Title Slot -->
  <g id="action-title-slot" data-pptx-placeholder="title" data-pptx-bounds="280 44 800 40">
    <text id="action-title-carrier" data-pptx-carrier="true" x="280" y="74" fill="#C00000" font-size="28" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>

  <!-- 4 Action Columns Slot (2x2 Matrix) -->
  <g id="action-matrix-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="72 114 1136 500">
    <text id="action-matrix-carrier" data-pptx-carrier="true" x="96" y="160" fill="#374151" font-size="14">
      {{ACTION_PLAN_MATRIX}}
    </text>
  </g>

  <!-- Slide Number Slot -->
  <g id="action-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="2" data-pptx-bounds="1128 670 80 28">
    <text id="action-slide-number-carrier" data-pptx-carrier="true" x="1208" y="694" text-anchor="end" fill="#9CA3AF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">{{PAGE_NUM}}</text>
  </g>
</svg>
